  <!-- ===== Tailwind (CDN) and theme config ===== -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            space: '#050816',
            electric: '#00D4FF',
            neon: '#8B5CF6',
            aqua: '#06B6D4',
            soft: '#F8FAFC',
          },
          fontFamily: {
            display: ['Orbitron', 'sans-serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- ===== Custom styles ===== -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="bg-space text-soft font-sans antialiased">
  <!-- Skip link (label rendered from data.js) -->
  <a id="skip-link" class="skip-link" href="#main"></a>

  <!-- ===== Header / navigation ===== -->
  <header id="site-header" class="site-header fixed inset-x-0 top-0 z-40">
    <!-- Scroll progress bar (driven by main.js) -->
    <div id="scroll-progress" class="scroll-progress" aria-hidden="true"></div>
    <nav class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3 sm:px-6 lg:px-8" aria-label="Primary">
      <a id="nav-brand" href="#home" class="font-display text-xl font-bold tracking-widest text-electric"></a>

      <!-- Desktop links -->
      <ul id="nav-links" class="hidden items-center gap-1 lg:flex"></ul>

      <div class="flex items-center gap-3">
        <a id="nav-resume" class="btn btn-outline hidden sm:inline-flex" download></a>
        <!-- Mobile menu toggle -->
        <button id="nav-toggle" type="button" class="nav-toggle lg:hidden" aria-expanded="false" aria-controls="mobile-menu">
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>
      </div>
    </nav>

    <!-- Mobile menu panel -->
    <div id="mobile-menu" class="mobile-menu lg:hidden" hidden>
      <ul id="mobile-links" class="flex flex-col gap-1 px-4 pb-4"></ul>
    </div>
  </header>

  <!-- ===== Main content: seven sections, filled by main.js ===== -->
  <main id="main" tabindex="-1">
    <section id="home" class="section section-hero" aria-label="Introduction"></section>
    <section id="about" class="section" data-accent="electric" aria-labelledby="about-title"></section>
    <section id="skills" class="section" data-accent="neon" aria-labelledby="skills-title"></section>
    <section id="projects" class="section" data-accent="aqua" aria-labelledby="projects-title"></section>
    <section id="experience" class="section" data-accent="neon" aria-labelledby="experience-title"></section>
    <section id="education" class="section" data-accent="electric" aria-labelledby="education-title"></section>
    <section id="contact" class="section" data-accent="neon" aria-labelledby="contact-title"></section>
  </main>

  <!-- ===== Project details modal (filled by main.js) ===== -->
  <dialog id="project-modal" class="modal" aria-labelledby="modal-title">
    <div class="modal-panel glass" id="modal-panel"></div>
  </dialog>

  <!-- ===== Footer ===== -->
  <footer class="border-t border-white/10 py-8 text-center text-sm text-slate-400">
    <p id="footer-text" class="px-4"></p>
  </footer>

  <!-- ===== Scripts ===== -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
          integrity="sha512-dLxUelApnYxpLt6K2iomGngnHO83iUvZytA3YjDUCjT0HDOHKXnVYdf3hU4JjM8uEhxf9nD1/ey98U3t2vZ0qQ=="
          crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
  <script src="data.js" defer></script>
  <script src="main.js" defer></script>
  <script src="bg-3d.js" defer></script>
  <script src="hero-3d.js" defer></script>
</body>
</html>
