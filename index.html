  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            space: '#050816',
            ink: '#E6EDF7',
            muted: '#8A96AD',
            cyan: '#00D4FF',
            purple: '#8B5CF6',

            surface: 'rgba(255,255,255,0.04)',

<body class="bg-space text-ink font-sans antialiased">
  <!-- Boot screen: CSS hides it by 600 ms even if scripts fail -->
  <div id="boot" class="boot" aria-hidden="true">
    <div class="boot-mark"><span id="boot-initials"></span><span class="boot-line"></span></div>
  </div>

  <!-- Skip link (label from data.js) -->
  <a id="skip-link" class="skip-link" href="#main"></a>

  <!-- ===== Header / navigation ===== -->
  <header id="site-header" class="site-header">
    <div id="scroll-progress" class="scroll-progress" aria-hidden="true"></div>
    <nav class="nav-bar" aria-label="Primary">
      <a id="nav-brand" href="#home" class="nav-brand"></a>
      <ul id="nav-links" class="nav-links"></ul>
      <div class="nav-actions">
        <button id="palette-open" type="button" class="icon-btn kbd-btn"><kbd>/</kbd></button>
        <button id="toggle-3d" type="button" class="pill-btn toggle-3d" aria-pressed="true"></button>
        <a id="nav-resume" class="btn btn-outline nav-resume" download></a>
        <button id="nav-toggle" type="button" class="icon-btn nav-toggle" aria-expanded="false" aria-controls="mobile-sheet">
          <span class="nav-toggle-bar"></span><span class="nav-toggle-bar"></span><span class="nav-toggle-bar"></span>
        </button>
      </div>
    </nav>
    <!-- Mobile sheet -->
    <div id="mobile-sheet" class="mobile-sheet" hidden>
      <ul id="mobile-links" class="mobile-links"></ul>
    </div>
  </header>

  <!-- ===== Main: seven sections, filled by main.js ===== -->
  <main id="main" tabindex="-1">
    <section id="home" class="section section-hero" data-accent="cyan" aria-label="Introduction"></section>
    <section id="about" class="section" data-accent="cyan" aria-labelledby="about-title"></section>
    <section id="skills" class="section" data-accent="purple" aria-labelledby="skills-title"></section>
    <section id="projects" class="section" data-accent="cyan" aria-labelledby="projects-title"></section>
    <section id="experience" class="section" data-accent="purple" aria-labelledby="experience-title"></section>
    <section id="education" class="section" data-accent="purple" aria-labelledby="education-title"></section>
    <section id="contact" class="section" data-accent="teal" aria-labelledby="contact-title"></section>
  </main>

  <!-- ===== Project details modal (filled by main.js) ===== -->
  <dialog id="project-modal" class="modal" aria-labelledby="modal-title">
    <div id="modal-panel" class="modal-panel glass"></div>
  </dialog>

  <!-- ===== Footer ===== -->
  <footer class="site-footer">
    <div id="footer-inner" class="container-x footer-inner"></div>
  </footer>
